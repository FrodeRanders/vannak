name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "300"
  CARGO_NET_RETRY: "3"

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Unit tests + clippy (all feature combinations)
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-workspaces: |
            . -> target

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: clippy (no features)
        run: cargo clippy --all-targets -- -D warnings

      - name: test (no features)
        run: cargo test

      - name: clippy (daemon)
        run: cargo clippy --features daemon --all-targets -- -D warnings

      - name: test (daemon)
        run: cargo test --features daemon

      - name: clippy (ipto-writer)
        run: cargo clippy --features ipto-writer --all-targets -- -D warnings

      - name: clippy (raft)
        run: cargo clippy --features raft --all-targets -- -D warnings

      - name: test (raft)
        run: cargo test --features raft

      - name: clippy (node)
        run: cargo clippy --features node --all-targets -- -D warnings

      - name: build (node)
        run: cargo build --features node

      - name: clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: test (all features)
        run: cargo test --all-features

      - name: test (optimized, all features)
        run: cargo test --release --all-features

  # -----------------------------------------------------------------------
  # Ipto writer integration test (PostgreSQL)
  # -----------------------------------------------------------------------
  integration-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout ipto (SQL schema for PostgreSQL)
        run: git clone --depth 1 https://github.com/FrodeRanders/ipto.git ../ipto

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: |
            . -> target

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run integration test
        run: VANNAK_PG_PORT=5432 ./scripts/run-integration-test.sh --no-build

  # -----------------------------------------------------------------------
  # Raft cluster integration test (DNS auto-discovery)
  # -----------------------------------------------------------------------
  integration-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout sibling repos (SQL schema + Docker build context)
        run: |
          git clone --depth 1 https://github.com/FrodeRanders/ipto.git ../ipto
          git clone --depth 1 https://github.com/FrodeRanders/raft.git ../raft
          git clone --depth 1 https://github.com/FrodeRanders/sitas.git ../sitas

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: |
            . -> target

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run cluster test
        run: ./scripts/run-integration-test.sh --cluster --no-build

  # Live Kafka verifies durable admission into the service's queryable index.
  integration-kafka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: |
            . -> target
      - name: Checkout Ipto SQL schema
        run: git clone --depth 1 https://github.com/FrodeRanders/ipto.git ../ipto
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler zlib1g-dev
      - name: Start PostgreSQL
        run: docker compose -f docker-compose.test.yml up -d --wait postgres
      - name: Start Kafka broker
        run: docker compose -f docker-compose.kafka.yml up -d --wait redpanda
      - name: Test Kafka service admission
        run: VANNAK_KAFKA_INTEGRATION=1 cargo test --features kafka-client --test kafka_integration -- --nocapture
      - name: Test actual supervisor and restart
        run: VANNAK_SUPERVISOR_INTEGRATION=1 cargo test --all-features --test supervisor_integration -- --nocapture
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
      - name: Stop Kafka broker
        if: always()
        run: docker compose -f docker-compose.kafka.yml down -v

  # -----------------------------------------------------------------------
  # Format check
  # -----------------------------------------------------------------------
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check
