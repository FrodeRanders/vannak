[package]
name = "vannak"
version = "0.1.0"
edition = "2024"
description = "Operational knowledge plane for pipeline events and metadata impact analysis."
license = "Apache-2.0"

[lib]
name = "vannak"
path = "src/lib.rs"

[dependencies]
ipto = { git = "https://github.com/FrodeRanders/ipto.git", rev = "b855a92f257e8b1fa6847799be57945c97aa5729", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["v7"], optional = true }
gautelis-graft-core = { version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
gautelis-graft-runtime = { version = "0.1.0", optional = true }
gautelis-graft-storage = { version = "0.1.0", optional = true }
gautelis-graft-transport = { version = "0.1.0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
parking_lot = { version = "0.12", optional = true }
gautelis-graft-proto = { version = "0.1.0", optional = true }
prost = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
sitas = { version = "0.1.0", optional = true }
rdkafka = { version = "0.36", optional = true }

[features]
default = []
daemon = ["dep:serde_json"]
ipto-writer = ["dep:ipto", "dep:serde_json", "dep:uuid"]
raft = ["dep:gautelis-graft-core", "dep:serde", "dep:serde_json"]
node = ["raft", "sitas-runtime", "dep:gautelis-graft-runtime", "dep:gautelis-graft-storage", "dep:gautelis-graft-transport", "dep:tokio", "dep:parking_lot", "dep:gautelis-graft-proto", "dep:prost", "dep:bytes", "dep:tracing-subscriber"]
sitas-runtime = ["dep:sitas"]
kafka-client = ["sitas-runtime", "dep:rdkafka", "dep:serde", "dep:serde_json"]

[[test]]
name = "vannak_integration"
required-features = ["ipto-writer"]

[[test]]
name = "kafka_integration"
required-features = ["kafka-client"]

[[test]]
name = "supervisor_integration"
required-features = ["node", "daemon", "kafka-client", "ipto-writer"]

[[bin]]
name = "vannak-node"
required-features = ["node"]

[[bin]]
name = "vannak"
required-features = ["node", "daemon"]

[[bin]]
name = "vannak-load"

[[bin]]
name = "vannak-kafka-ingest"
required-features = ["kafka-client"]
